[project]
name = "nowview-engine"
version = "0.1.0"
description = "NowView BPM 엔진 — Chaeksas BPM(BPMN 2.0) 위의 SC01"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psycopg[binary,pool]>=3.2",
    "chaeksas-core",
    "chaeksas-service-kit",  # C15 일꾼 — Center에서 서비스 태스크 일감을 가져간다(app/consumer.py)
    "openpyxl>=3.1",
    "httpx>=0.27",  # Center 연동 클라이언트(N3, app/sc01/center.py)
]

# Chaeksas BPM 엔진(BPMN 해석기)을 라이브러리로 쓴다(내장 시험용). 바깥 실행의 서비스 태스크는
# service_kit 일꾼이 Center에서 가져간다(C15, ADR-0102).
# 커밋에 고정한다: 브랜치를 따라가면 같은 락파일로 다른 엔진이 깔린다.
# core가 같은 워크스페이스의 contracts·llm·extension_api를 끌고 온다.
[tool.uv.sources]
chaeksas-core = { git = "https://github.com/wrapper755/Chaeksas", rev = "d479226d964b09a800ba305ee761cee4a520cbfc", subdirectory = "packages/core" }
chaeksas-service-kit = { git = "https://github.com/wrapper755/Chaeksas", rev = "d479226d964b09a800ba305ee761cee4a520cbfc", subdirectory = "packages/service_kit" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` 패키지를 설치하지 않고 임포트한다. tests/에 __init__.py를 두지 않는 이유도
# 같다 — conftest를 모듈로 직접 임포트해 고정물을 공유한다.
pythonpath = [".", "tests"]
# 비동기 테스트(허브·SSE)에 필요하다. strict가 기본이라 마커를 붙인 것만 돈다.
asyncio_mode = "strict"
# LLM 실호출은 기본 실행에서 뺀다 — 비결정적이고 모델 자격증명이 필요하다. `pytest -m llm`.
markers = ["llm: ollama 실호출이 필요한 테스트"]
addopts = "-m 'not llm'"
