[project]
name = "nowview-engine"
version = "0.1.0"
description = "NowView BPM 엔진 — LangGraph StateGraph + Agent 오케스트레이션"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` 패키지를 설치하지 않고 임포트한다. tests/에 __init__.py를 두지 않는 이유도
# 같다 — conftest를 모듈로 직접 임포트해 고정물을 공유한다.
pythonpath = ["."]
# 실제 LLM을 부르는 테스트는 기본 실행에서 뺀다 — 네트워크·비결정성 때문이다.
# 돌리려면 `pytest -m llm`.
markers = ["llm: ollama 실호출이 필요한 테스트"]
addopts = "-m 'not llm'"
