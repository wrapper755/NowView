# NowView CI
#
# 두 런타임을 각각 검증한다 — TypeScript 앱(verify)과 Python BPM 엔진(engine).
# **두 잡은 병렬로 돈다.** 서로 의존이 없고, 순차로 두면 어느 쪽이 깨졌는지
# 알기까지 더 오래 걸린다.
#
# 각 잡 안에서는 빠르게 실패하는 순서로 둔다 — lint(수초) → test(1초대) →
# build(가장 느림). build가 TypeScript 검사를 겸하므로 별도 typecheck 단계를
# 두지 않는다 (CLAUDE.md "Commands" 참조).
#
# 데이터가 전부 Mock 코드라 빌드에 환경 변수나 비밀값이 필요 없다. Agent 노드도
# 기본이 Mock이므로 **LLM 자격증명 없이 전부 검증된다** — ollama 실호출 테스트만
# 제외되고(`-m llm`), 계약 검증은 네트워크 없이 돌아 CI가 잡는다.
# 실제 백엔드에 Postgres가 붙으면 그때 서비스 컨테이너를 추가한다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 기본값이 넓으므로 읽기만 남긴다.
permissions:
  contents: read

# 같은 브랜치에 연달아 푸시하면 앞선 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TypeScript 앱 — 화면·서비스·API
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 로컬 런타임(Node 22)과 맞춘다. @types/node도 ^22다 — 어긋나면
          # 타입 정의와 실제 런타임이 다른 상태로 검증하게 된다.
          node-version: 22
          cache: npm

      # package-lock.json 기준으로 정확히 재현한다. 락파일이 package.json과
      # 어긋나 있으면 여기서 바로 실패한다 — 그게 이 단계의 목적 중 하나다.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Next.js 빌드 캐시. 빌드가 가장 느린 단계라 여기만 캐시한다.
      # 소스가 바뀌면 키가 갈라지고, 락파일만 같으면 이전 캐시를 가져다 쓴다.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

  # Python BPM 엔진 (engine/) — LangGraph StateGraph
  engine:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v7

      # **전체 버전으로 고정한다.** `astral-sh/setup-uv`는 v8부터 부동 메이저 태그(`v10`)를
      # 두지 않아 `@v10`은 "unable to find version"으로 실패한다 — actions/* 는 두므로
      # 관례처럼 짧게 쓰다가 걸렸다. 올릴 때 태그 존재를 직접 확인할 것:
      #   gh api repos/astral-sh/setup-uv/tags --jq '.[].name' | head
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # 엔진 의존성만 캐시 키에 넣는다 — 앱 쪽 변경으로 캐시가 날아가지 않게 한다.
          cache-dependency-glob: engine/uv.lock

      # Python 버전은 `engine/.python-version`이 원천이다. 여기에 또 적으면
      # 로컬 venv와 CI가 갈라진다 — node-version / @types/node에서 겪은 것과 같은 문제다.
      # uv가 없는 인터프리터는 직접 내려받으므로 setup-python이 필요 없다.
      - name: Install (locked)
        # uv.lock이 pyproject.toml과 어긋나면 여기서 바로 실패한다 — `npm ci`와 같은 몫이다.
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        # `-m 'not llm'`이 pyproject의 addopts에 있어 ollama 실호출은 자동으로 빠진다.
        # 비결정적이고 모델 자격증명이 필요하므로 CI에 넣지 않는다.
        run: uv run pytest
